name: Deploy Core Apps (main + auth + shop + admin)

# Push 自动部署需要 GCP IAP（VPS 22 端口不对公网开放）。
# 未配置 GCP_SA_KEY 时 push 会跳过部署步骤，避免 CI 误报红。
# 手动部署：Actions → Deploy Core Apps → Run workflow

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'main/**'
      - 'packages/ui/**'
      - 'packages/tokens/**'
      - 'auth-service/**'
      - 'shop/**'
      - 'admin/**'
      - 'shared/**'
      - 'cms/**'
      - 'bazi/**'
      - 'ziwei/**'
      - 'tarot/**'
      - 'deploy/**'
      - '.github/workflows/deploy-core.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'abutang-droid/orasage'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate auto-deploy (requires GCP_SA_KEY on push)
        id: gate
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$GCP_SA_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::GCP_SA_KEY not configured. Add secret per deploy/GITHUB-ACTIONS-SETUP.md, or run bash scripts/vps-deploy-main.sh on GCP Console SSH."
          fi

      - name: Setup SSH key
        if: steps.gate.outputs.run == 'true'
        env:
          KEY1: ${{ secrets.SSH_PRIVATE_KEY }}
          KEY2: ${{ secrets.SSH_KEY }}
          KEY3: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          SSH_PRIVATE_KEY="${KEY1:-${KEY2:-$KEY3}}"
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::未找到 SSH 私钥。请在 GitHub Secrets 添加 SSH_PRIVATE_KEY"
            exit 1
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST || '34.75.40.67' }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Configure SSH transport
        id: ssh_transport
        if: steps.gate.outputs.run == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '34.75.40.67' }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT || 'cloudpc-p-f58ae6f00b5c' }}
          GCP_ZONE: ${{ secrets.GCP_ZONE || 'us-east1-b' }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE || 'cloud-pc-cknotproylkasckrer1aejq45' }}
        run: |
          if timeout 25 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" "echo SSH_OK"; then
            echo "mode=direct" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::warning::直连 SSH 失败，尝试 GCP IAP..."

          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::无法 SSH 到 ${SSH_HOST}:22，且未配置 GCP_SA_KEY"
            echo "::error::见 deploy/GITHUB-ACTIONS-SETUP.md；或 GCP Console SSH 运行 scripts/vps-deploy-main.sh"
            exit 1
          fi

          echo "$GCP_SA_KEY" > /tmp/gcp-sa.json
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-cloud-cli
          gcloud auth activate-service-account --key-file=/tmp/gcp-sa.json
          gcloud config set project "$GCP_PROJECT"
          PROXY_CMD="gcloud compute start-iap-tunnel ${GCP_INSTANCE} 22 --listen-on-stdin --project=${GCP_PROJECT} --zone=${GCP_ZONE}"
          echo "GCP_IAP_PROXY_COMMAND=$PROXY_CMD" >> "$GITHUB_ENV"
          timeout 30 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=no \
            -o "ProxyCommand=$PROXY_CMD" \
            "${SSH_USER}@${SSH_HOST}" "echo IAP_SSH_OK"
          echo "mode=iap" >> "$GITHUB_OUTPUT"

      - name: Full deploy on VPS (bootstrap-all)
        if: steps.gate.outputs.run == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '34.75.40.67' }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          BRANCH: ${{ github.ref_name }}
          GCP_IAP_PROXY_COMMAND: ${{ env.GCP_IAP_PROXY_COMMAND }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          if [ -n "${GCP_IAP_PROXY_COMMAND:-}" ]; then
            SSH_OPTS="$SSH_OPTS -o ProxyCommand='$GCP_IAP_PROXY_COMMAND'"
          fi
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "sudo chown -R ubuntu:ubuntu /opt/orasage 2>/dev/null || true; \
             cd /opt/orasage && git fetch origin ${BRANCH} && git checkout ${BRANCH} && git reset --hard origin/${BRANCH}; \
             sudo ORASAGE_REF=${BRANCH} FORTUNE_MODE=native SKIP_CMS=0 DEPLOY_DIR=/opt/orasage \
               bash deploy/bootstrap-all-on-vps.sh; \
             bash /opt/orasage/scripts/cms/p0-rewrite-pdp-guides.sh || true; \
             sudo nginx -t && sudo systemctl reload nginx"

      - name: Verify deployment
        if: steps.gate.outputs.run == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '34.75.40.67' }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          GCP_IAP_PROXY_COMMAND: ${{ env.GCP_IAP_PROXY_COMMAND }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          if [ -n "${GCP_IAP_PROXY_COMMAND:-}" ]; then
            SSH_OPTS="$SSH_OPTS -o ProxyCommand='$GCP_IAP_PROXY_COMMAND'"
          fi
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "curl -sf http://127.0.0.1:3101/health && echo && \
             curl -sI https://orasage.com | head -3 && \
             curl -sI https://shop.orasage.com | head -3 && \
             curl -sI https://bazi.orasage.com/sitemap.xml | head -3"
