# orcos.win — 与 orasage.com 同端口后端（Cloudflare Tunnel 直连本机端口时，
# 本文件主要用于 :80 ACME / 直连兜底；公网入口以 Tunnel Public Hostname 为准）
#
# 安装:
#   sudo cp deploy/nginx/orcos-win.conf /etc/nginx/sites-available/orcos-win
#   sudo ln -sf /etc/nginx/sites-available/orcos-win /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade_orcos {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        orcos.win
        www.orcos.win
        auth.orcos.win
        shop.orcos.win
        admin.orcos.win
        bazi.orcos.win
        ziwei.orcos.win
        tarot.orcos.win
        cms.orcos.win;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Tunnel 已终结 TLS 时，源站可用 HTTP；若直连公网再配 443
    location / {
        return 301 https://$host$request_uri;
    }
}
