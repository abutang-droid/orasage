# Cloudflare Tunnel typically maps admin.orasage.com -> http://127.0.0.1:3103
# Without this split, /cms/* hits the admin Next app and returns 404.
# Admin Next must listen on 3104 (systemd drop-in PORT=3104).
server {
    listen 127.0.0.1:3103;
    server_name _;
    client_max_body_size 50m;

    location /cms/ {
        proxy_pass http://127.0.0.1:3120/cms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /cms {
        return 301 /cms/;
    }

    location / {
        proxy_pass http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
