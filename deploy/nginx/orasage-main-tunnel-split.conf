# Cloudflare Tunnel points orasage.com -> http://127.0.0.1:3100
# Split /launch* to the static countdown board; everything else to main Next (:3105).
server {
    listen 127.0.0.1:3100;
    server_name _;

    client_max_body_size 20m;

    location = /launch {
        default_type text/html;
        charset utf-8;
        alias /opt/orasage/main/public/launch.html;
        add_header Cache-Control "public, max-age=60";
    }

    location = /launch/ {
        return 308 /launch;
    }

    location = /launch.html {
        default_type text/html;
        charset utf-8;
        alias /opt/orasage/main/public/launch.html;
        add_header Cache-Control "public, max-age=60";
    }

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
