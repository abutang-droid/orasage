# Cloudflare Tunnel points orasage.com -> http://127.0.0.1:3100
# Split /launch* to the static countdown board; everything else to main Next (:3105).
server {
    listen 127.0.0.1:3100;
    server_name _;

    client_max_body_size 20m;

    location = /launch {
        default_type text/html;
        charset utf-8;
        alias /opt/orasage/main/public/launch.html;
        add_header Cache-Control "public, max-age=60";
    }

    location = /launch/ {
        return 308 /launch;
    }

    location = /launch.html {
        default_type text/html;
        charset utf-8;
        alias /opt/orasage/main/public/launch.html;
        add_header Cache-Control "public, max-age=60";
    }


    
    # Tablet APK — before Next locale middleware
    location = /orasagetablet.apk {
        alias /var/www/orasage-downloads/orasagetablet.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Type application/vnd.android.package-archive always;
        add_header Content-Disposition "attachment; filename=\"orasagetablet.apk\"" always;
        add_header Cache-Control "no-store" always;
    }
    location = /gettablet.apk {
        return 302 /orasagetablet.apk;
    }
    location = /get-tablet.apk {
        return 302 /orasagetablet.apk;
    }
    location = /downloads/orasagetablet.apk {
        alias /var/www/orasage-downloads/orasagetablet.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Type application/vnd.android.package-archive always;
        add_header Content-Disposition "attachment; filename=\"orasagetablet.apk\"" always;
        add_header Cache-Control "no-store" always;
    }
    location = /downloads/ {
        alias /var/www/orasage-downloads/index.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }
    location = /downloads {
        return 302 /downloads/;
    }

    location / {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
