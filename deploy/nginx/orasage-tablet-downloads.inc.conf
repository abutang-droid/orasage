# Tablet APK only. Do not alias /downloads/ to a file (nginx concatenates
# index.htmlindex.html → 500). HTML lives in Next at /{locale}/downloads.
location = /get-tablet.apk {
    alias /var/www/orasage-downloads/orasage-tablet.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Type application/vnd.android.package-archive always;
    add_header Content-Disposition "attachment; filename=\"orasage-tablet.apk\"" always;
    add_header Cache-Control "no-store" always;
}
